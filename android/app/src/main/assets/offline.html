<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Connexion indisponible</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f8f7;color:#173b39;font-family:system-ui,-apple-system,sans-serif;padding:24px}.card{width:min(100%,420px);background:#fff;border:1px solid #d8e7e4;border-radius:24px;padding:32px;box-shadow:0 18px 45px rgba(15,118,110,.12);text-align:center}.mark{width:72px;height:72px;margin:0 auto 20px;border-radius:22px;background:#0f766e;color:#fff;display:grid;place-items:center;font-size:34px;font-weight:800}h1{font-size:24px;margin:0 0 12px}p{line-height:1.55;color:#58716f;margin:0 0 24px}button{width:100%;border:0;border-radius:14px;background:#0f766e;color:#fff;font:inherit;font-weight:750;padding:15px;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">V</div>
    <h1>Connexion indisponible</h1>
    <p>Vérifiez votre connexion Internet, puis réessayez. Vos données restent protégées sur le serveur.</p>
    <button type="button" onclick="location.href='https://suivi-ventes.netlify.app/'">Réessayer</button>
  </main>
</body>
</html>
