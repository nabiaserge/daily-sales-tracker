apply plugin: 'com.android.application'

def uploadStoreFile = System.getenv('SIGNING_STORE_FILE')
def uploadStorePassword = System.getenv('SIGNING_STORE_PASSWORD')
def uploadKeyAlias = System.getenv('SIGNING_KEY_ALIAS')
def uploadKeyPassword = System.getenv('SIGNING_KEY_PASSWORD')
def hasUploadSigning = [uploadStoreFile, uploadStorePassword, uploadKeyAlias, uploadKeyPassword].every { it }

android {
    namespace 'com.nabia.suiviventes'
    compileSdk 36

    defaultConfig {
        applicationId 'com.nabia.suiviventes'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasUploadSigning) {
            release {
                storeFile file(uploadStoreFile)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasUploadSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.fork = true
    options.forkOptions.executable = 'C:\\Program Files\\Java\\jdk-17\\bin\\javac.exe'
}
