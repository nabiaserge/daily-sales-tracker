[build]
  command = "mkdir -p dist/assets dist/.well-known && cp index.html manifest.webmanifest privacy.html service-worker.js dist/ && cp assets/*.js dist/assets/ && cp .well-known/assetlinks.json dist/.well-known/"
  publish = "dist"
  functions = "netlify/functions"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

# Digital Asset Links: lets Android share saved sign-in credentials between the site and the app.
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
